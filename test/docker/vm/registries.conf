# Pulls jiji-proxy from the compose `registry` service first, so the suite runs the proxy built
# from the checkout (including a version not yet published, e.g. on a release commit). Podman
# falls back to ghcr.io when the mirror doesn't have the requested tag.
[[registry]]
prefix = "ghcr.io/acidtib/jiji-proxy"
location = "ghcr.io/acidtib/jiji-proxy"

[[registry.mirror]]
location = "172.30.0.13:5000/acidtib/jiji-proxy"
insecure = true
