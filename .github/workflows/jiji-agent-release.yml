name: jiji-agent release

# Called by release.yml for a freshly tagged release, or dispatched by hand to rebuild an
# existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach binaries to, e.g. jiji-agent-v0.5.2"
        required: true

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/binary-release.yml
    with:
      tag: ${{ inputs.tag }}
      tag_prefix: "jiji-agent-v"
      bin_name: jiji-agent
      changelog_crate: jiji-agent
      checksum: true
      install_instructions: false
      notify_website: false
      refresh_changelog_script: ${{ github.event_name == 'workflow_dispatch' }}
      matrix_json: >-
        [
          {"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"jiji-agent-linux-x86_64"},
          {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","artifact":"jiji-agent-linux-arm64"}
        ]
