name: jiji-proxy release

# Called by release.yml for a freshly tagged release, or dispatched by hand to rebuild an
# existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and push the image for, e.g. jiji-proxy-v0.5.0"
        required: true

env:
  IMAGE: ghcr.io/acidtib/jiji-proxy

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Get tag version
        id: get_tag_version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "TAG_VERSION=${TAG#jiji-proxy-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU emulation: each arch builds natively on its own runner,
      # matching this repo's existing binary release workflows -- jiji-proxy
      # pulls in native C dependencies (clang/cmake, per its Dockerfile) that
      # make emulated cross-builds slow and fragile.
      - name: Build and push arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/jiji-proxy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-${{ matrix.suffix }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Get tag version
        id: get_tag_version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "TAG_VERSION=${TAG#jiji-proxy-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish combined multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }} \
            ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-amd64 \
            ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-arm64
