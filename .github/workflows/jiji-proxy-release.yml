name: jiji-proxy release

on:
  push:
    tags:
      - "jiji-proxy-v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/acidtib/jiji-proxy

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get tag version
        id: get_tag_version
        run: echo "TAG_VERSION=${GITHUB_REF/refs\/tags\/jiji-proxy-v/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU emulation: each arch builds natively on its own runner,
      # matching this repo's existing binary release workflows -- jiji-proxy
      # pulls in native C dependencies (clang/cmake, per its Dockerfile) that
      # make emulated cross-builds slow and fragile.
      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/jiji-proxy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-${{ matrix.suffix }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Get tag version
        id: get_tag_version
        run: echo "TAG_VERSION=${GITHUB_REF/refs\/tags\/jiji-proxy-v/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish combined multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }} \
            ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-amd64 \
            ${{ env.IMAGE }}:v${{ steps.get_tag_version.outputs.TAG_VERSION }}-arm64
