name: release-please

# Opens and updates the release PR only. Tagging and building happen in release.yml, once CI has
# passed on the merged release commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # The PR body must stay as release-please wrote it (it is parsed again on merge), so the
      # readable summary goes in a comment instead.
      - name: Summarize the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/release-pr-summary.py
