name: jiji release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach binaries to, e.g. v0.5.2"
        required: true

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/binary-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      tag_prefix: "v"
      bin_name: jiji
      changelog_crate: jiji-cli
      checksum: false
      install_instructions: true
      notify_website: true
      refresh_changelog_script: ${{ inputs.tag != '' }}
      # Cross-compiling to x86_64 on Apple Silicon hardware rather than
      # using macos-13 (native Intel): confirmed live, macos-13 runners
      # can queue indefinitely waiting for a runner to be assigned,
      # while macos-14 gets one immediately.
      matrix_json: >-
        [
          {"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"jiji-linux-x86_64"},
          {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","artifact":"jiji-linux-arm64"},
          {"os":"macos-14","target":"x86_64-apple-darwin","artifact":"jiji-macos-x86_64"},
          {"os":"macos-14","target":"aarch64-apple-darwin","artifact":"jiji-macos-arm64"}
        ]
    secrets:
      JIJI_WEBSITE_DISPATCH_TOKEN: ${{ secrets.JIJI_WEBSITE_DISPATCH_TOKEN }}
