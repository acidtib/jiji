name: jiji release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jiji-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: jiji-linux-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: jiji-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: jiji-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin jiji --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jiji dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get tag version
        id: get_tag_version
        run: echo "TAG_VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Fetch changelog from release-please's release
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ steps.get_tag_version.outputs.TAG_VERSION }}
        run: |
          delimiter="CHANGELOG_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            gh release view "v$TAG_VERSION" \
              --repo "${{ github.repository }}" --json body -q .body || true
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Expand bumped crates' actual changelog content
        id: expanded
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          delimiter="EXPANDED_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            printf '%s' "$CHANGELOG_BODY" | \
              .github/scripts/expand-dependency-changelog.sh jiji-cli
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.get_tag_version.outputs.TAG_VERSION }}
          name: v${{ steps.get_tag_version.outputs.TAG_VERSION }}
          allowUpdates: true
          generateReleaseNotes: false
          artifacts: "dist/jiji-linux-x86_64,dist/jiji-linux-arm64,dist/jiji-macos-x86_64,dist/jiji-macos-arm64"
          body: |
            ${{ steps.expanded.outputs.body }}

            ## Installation

            ```bash
            curl -fsSL https://get.jiji.run/install.sh | VERSION=v${{ steps.get_tag_version.outputs.TAG_VERSION }} sh
            ```

      - name: Notify jiji-website of the new release
        env:
          GH_TOKEN: ${{ secrets.JIJI_WEBSITE_DISPATCH_TOKEN }}
          TAG_VERSION: ${{ steps.get_tag_version.outputs.TAG_VERSION }}
        run: |
          gh api repos/acidtib/jiji-website/dispatches \
            -f event_type=jiji-release \
            -f "client_payload[version]=v$TAG_VERSION"
