name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jiji-linux-x86_64
            agent_artifact: jiji-agent-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: jiji-linux-arm64
            agent_artifact: jiji-agent-linux-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: jiji-macos-x86_64
            agent_artifact: ""
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: jiji-macos-arm64
            agent_artifact: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin jiji --target ${{ matrix.target }}

      - name: Build agent binary (remote hosts are Linux)
        if: matrix.agent_artifact != ''
        run: cargo build --release --bin jiji-agent --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jiji dist/${{ matrix.artifact }}

      - name: Package agent binary and checksum
        if: matrix.agent_artifact != ''
        run: |
          cp target/${{ matrix.target }}/release/jiji-agent dist/${{ matrix.agent_artifact }}
          sha256sum dist/${{ matrix.agent_artifact }} | awk '{print $1}' > dist/${{ matrix.agent_artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Upload agent artifact
        if: matrix.agent_artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.agent_artifact }}
          path: |
            dist/${{ matrix.agent_artifact }}
            dist/${{ matrix.agent_artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get tag version
        id: get_tag_version
        run: echo "TAG_VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.get_tag_version.outputs.TAG_VERSION }}
          name: v${{ steps.get_tag_version.outputs.TAG_VERSION }}
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: "dist/jiji-linux-x86_64,dist/jiji-linux-arm64,dist/jiji-macos-x86_64,dist/jiji-macos-arm64,dist/jiji-agent-linux-x86_64,dist/jiji-agent-linux-x86_64.sha256,dist/jiji-agent-linux-arm64,dist/jiji-agent-linux-arm64.sha256"
          body: |
            ## Installation

            ```bash
            curl -fsSL https://get.jiji.run/install.sh | VERSION=v${{ steps.get_tag_version.outputs.TAG_VERSION }} sh
            ```

            ## Changes in v${{ steps.get_tag_version.outputs.TAG_VERSION }}

      - name: Notify jiji-website of the new release
        env:
          GH_TOKEN: ${{ secrets.JIJI_WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/acidtib/jiji-website/dispatches \
            -f event_type=jiji-release \
            -f "client_payload[version]=v${{ steps.get_tag_version.outputs.TAG_VERSION }}"
