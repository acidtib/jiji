name: require CI

# Release gate: passes once CI has passed for the tagged commit, without rebuilding anything.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag whose commit must have passed CI"
        required: true
        type: string

jobs:
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/require-ci-success.sh "$TAG"
