name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run tests
        run: cargo nextest run --workspace

      - name: Build
        run: cargo build --workspace

      - name: Test CLI functionality
        run: |
          cargo run --bin jiji -- --help
          cargo run --bin jiji -- init --help
          cargo run --bin jiji -- server --help
          cargo run --bin jiji -- version

  docker-integration:
    name: docker-in-docker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build jiji
        run: cargo build -p jiji-cli --bin jiji

      # `jiji server setup` prefers a jiji-agent binary sitting beside the `jiji` executable over
      # downloading one from a GitHub release (see agent_install::find_local_agent_binary), the
      # same mechanism `mise install-dev` uses for local testing. Building it here from the exact
      # commit under test means this job never depends on a matching jiji-agent release already
      # being published -- required on a release-please version-bump PR (no release exists for
      # the bumped version yet) and when this workflow runs as the release pipelines' own
      # pre-build gate (the release being built is what would need to exist).
      - name: Build jiji-agent (local sibling binary, no release download needed)
        run: cargo build -p jiji-agent --bin jiji-agent

      # docker_build_deploy_test.rs builds and pushes with the LOCAL machine's own Podman
      # (builder.engine: podman drives both the local build step and the remote install), not
      # just vm1's -- the runner image doesn't guarantee one, so make sure it's there.
      - name: Ensure local Podman is available
        run: |
          command -v podman >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y podman
          }

      # Privileged nested containers standing in for real remote hosts (see
      # test/docker/compose.yml): vm1 runs its own systemd and, once `jiji server setup` installs
      # it under test, its own Podman. This proves jiji actually works against a real kernel
      # (WireGuard module, cgroup v2, nftables) rather than only against the mock-SSH suite's
      # canned command output.
      - name: Bring up docker fixtures
        run: docker compose -f test/docker/compose.yml up -d --build --wait

      - name: Run docker integration tests
        env:
          JIJI_DOCKER_TESTS: "1"
        run: cargo nextest run -p jiji-cli --test=docker_server_lifecycle_test --test=docker_deploy_test --test=docker_build_deploy_test --test=docker_rolling_deploy_test --test=docker_mesh_deploy_test --test=docker_network_mode_test --test=docker_cron_test --test=docker_image_retention_test --test=docker_load_balancer_test --test=docker_cron_ownership_transfer_test --test=docker_scale_test --test=docker_stop_first_test --test=docker_service_restart_rollback_test --no-capture

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f test/docker/compose.yml logs --no-color --tail 200

      # `docker compose logs` above only covers vm1/vm2's own outer systemd boot output --
      # jiji-proxy runs *inside* vm1/vm2's own nested Podman (started by jiji-agent under test),
      # so its own logs (DNS discovery, health checks, refresh_interval activity) are otherwise
      # invisible to CI on a failure. `|| true` on each: not every test that fails has actually
      # brought up jiji-proxy on both hosts (or at all), and a missing container must not mask
      # the real failure above.
      - name: Dump jiji-proxy logs on failure
        if: failure()
        run: |
          docker compose -f test/docker/compose.yml exec -T vm1 podman logs jiji-proxy || true
          docker compose -f test/docker/compose.yml exec -T vm2 podman logs jiji-proxy || true

      - name: Tear down docker fixtures
        if: always()
        run: docker compose -f test/docker/compose.yml down -t 0 -v
