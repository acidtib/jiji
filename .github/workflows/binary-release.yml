name: binary release

# Shared build-matrix + GitHub Release logic for the native-binary release
# workflows (jiji, jiji-agent). jiji-proxy is a Docker image with no binaries
# and no GitHub Release step, so it stays a separate workflow rather than
# being folded in here.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to check out, build, and release (short name, e.g. v0.5.2)"
        required: true
        type: string
      tag_prefix:
        description: "Prefix to strip from the tag to get the version, e.g. v or jiji-agent-v"
        required: true
        type: string
      bin_name:
        description: "Cargo --bin name to build"
        required: true
        type: string
      changelog_crate:
        description: "Crate directory under crates/ whose CHANGELOG.md and expand-dependency-changelog.sh argument this release uses"
        required: true
        type: string
      matrix_json:
        description: "JSON-encoded build matrix: [{os, target, artifact}, ...]"
        required: true
        type: string
      checksum:
        description: "Generate a sha256 file alongside each binary"
        required: false
        type: boolean
        default: false
      install_instructions:
        description: "Append the curl install snippet to the release body"
        required: false
        type: boolean
        default: false
      notify_website:
        description: "Dispatch a jiji-website release notification"
        required: false
        type: boolean
        default: false
      refresh_changelog_script:
        description: "Re-checkout the changelog script from main (workflow_dispatch backfill only)"
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix_json) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          BIN_NAME: ${{ inputs.bin_name }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --bin "$BIN_NAME" --target "$TARGET"

      - name: Package binary
        env:
          BIN_NAME: ${{ inputs.bin_name }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN_NAME" "dist/$ARTIFACT"

      # macOS runners have shasum but no sha256sum. Fail loudly rather than publish an empty file.
      - name: Generate checksum
        if: ${{ inputs.checksum }}
        shell: bash
        env:
          ARTIFACT: dist/${{ matrix.artifact }}
        run: |
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$ARTIFACT")
          else
            sum=$(shasum -a 256 "$ARTIFACT")
          fi
          hash=${sum%% *}
          if ! [[ "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not compute a SHA-256 for $ARTIFACT (got '$sum')."
            exit 1
          fi
          echo "$hash" > "$ARTIFACT.sha256"

      - name: Upload artifact
        if: ${{ !inputs.checksum }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.bin_name }}--${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Upload artifact with checksum
        if: ${{ inputs.checksum }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.bin_name }}--${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # When backfilling an old tag, the checkout above reverts this whole
      # tree, including this script, back to whatever existed at that
      # historical commit -- confirmed live, this shadowed a bugfix that
      # only existed on main. Always use main's current copy instead.
      - name: Use current changelog script
        if: ${{ inputs.refresh_changelog_script }}
        run: git checkout ${{ github.sha }} -- .github/scripts/expand-dependency-changelog.sh

      - name: Get tag version
        id: get_tag_version
        env:
          TAG: ${{ inputs.tag }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: echo "TAG_VERSION=${TAG#"$TAG_PREFIX"}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A release.yml run builds several binaries; take only this one's.
          pattern: ${{ inputs.bin_name }}--*
          path: dist
          merge-multiple: true

      # Reads the crate's CHANGELOG.md directly rather than the GitHub
      # release's current body: the release body is mutated by this same
      # job on every run (see "Create GitHub Release" below), so using it
      # as the starting point is not idempotent -- confirmed live, running
      # this job twice for the same tag duplicated the whole release body.
      - name: Extract this release's changelog section
        id: changelog
        env:
          CHANGELOG_CRATE: ${{ inputs.changelog_crate }}
        run: |
          delimiter="CHANGELOG_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            awk '/^## / { n++ } n==1' "crates/$CHANGELOG_CRATE/CHANGELOG.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Expand bumped crates' actual changelog content
        id: expanded
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          CHANGELOG_CRATE: ${{ inputs.changelog_crate }}
        run: |
          delimiter="EXPANDED_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            printf '%s' "$CHANGELOG_BODY" | \
              .github/scripts/expand-dependency-changelog.sh "$CHANGELOG_CRATE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          EXPANDED_BODY: ${{ steps.expanded.outputs.body }}
          TAG_VERSION: ${{ steps.get_tag_version.outputs.TAG_VERSION }}
          INSTALL_INSTRUCTIONS: ${{ inputs.install_instructions }}
        run: |
          delimiter="BODY_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$EXPANDED_BODY"
            if [ "$INSTALL_INSTRUCTIONS" = "true" ]; then
              # Backticks and $ stay literal in the Markdown body.
              # shellcheck disable=SC2016
              printf '\n## Installation\n\n```bash\ncurl -fsSL https://get.jiji.run/install.sh | VERSION=v%s sh\n```\n' "$TAG_VERSION"
            fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag_prefix }}${{ steps.get_tag_version.outputs.TAG_VERSION }}
          name: ${{ inputs.tag_prefix }}${{ steps.get_tag_version.outputs.TAG_VERSION }}
          allowUpdates: true
          generateReleaseNotes: false
          artifacts: "dist/*"
          body: |
            ${{ steps.body.outputs.body }}

      # A courtesy notification, not part of this repo's release: must never
      # fail the job over it.
      - name: Mint jiji-website dispatch token
        id: website-token
        if: ${{ inputs.notify_website }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: acidtib
          repositories: jiji-website
          permission-contents: write

      - name: Notify jiji-website of the new release
        if: ${{ inputs.notify_website && steps.website-token.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
          TAG_VERSION: ${{ steps.get_tag_version.outputs.TAG_VERSION }}
        run: |
          gh api repos/acidtib/jiji-website/dispatches \
            -f event_type=jiji-release \
            -f "client_payload[version]=v$TAG_VERSION"
