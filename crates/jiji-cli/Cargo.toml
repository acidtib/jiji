[package]
name = "jiji-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "jiji"

[lib]
name = "jiji_cli"
path = "src/lib.rs"

[[bin]]
name = "jiji"
path = "src/main.rs"

# Thin wrapper around the same jiji_cli::run(), auto-discovered from src/bin/jiji_dev.rs, so
# `mise run install-dev` can install a local test build side by side with the real `jiji` on
# PATH without overwriting it.

[dependencies]
jiji-core.workspace = true
jiji-tui.workspace = true
jiji-config.workspace = true
jiji-network.workspace = true
jiji-ssh.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_yaml.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
russh.workspace = true
rand = "0.10"
