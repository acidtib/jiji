[package]
name = "jiji-agent"
version = "0.5.2"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "jiji-agent"
path = "src/main.rs"

[lib]
name = "jiji_agent"
path = "src/lib.rs"

[dependencies]
jiji-network.workspace = true
# Transitively linked already via jiji-network (whose `NetworkedContainerRun.engine` field is
# `jiji_config::ContainerEngine`); declared directly here only so `cron_exec.rs` can name that
# type at the one point it builds a `NetworkedContainerRun` -- this crate's own durable/wire types
# still deliberately never reuse a jiji-config schema type (see `cron.rs`'s module doc comment).
jiji-config.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "io-util",
    "time",
    "sync",
    "process",
] }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
