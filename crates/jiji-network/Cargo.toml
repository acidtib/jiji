[package]
name = "jiji-network"
version = "0.9.1"
edition.workspace = true
license.workspace = true

[dependencies]
jiji-core.workspace = true
jiji-config.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[build-dependencies]
toml = "0.8"

[dev-dependencies]
serde_yaml.workspace = true

# toml is used by the include!'d lib/build-support/sibling_crate_version.rs, which cargo-shear can't see.
[package.metadata.cargo-shear]
ignored = ["toml"]
