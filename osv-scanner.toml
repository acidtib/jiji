[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "Jiji uses rsa only through russh/ssh-key for SSH public-key authentication: RSA private keys sign session data and public keys verify signatures. Neither dependency calls rsa ciphertext decryption or depadding APIs, so the attacker-observable RSA decryption required by the Marvin attack is unreachable."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "Informational unmaintained advisory for derivative, a compile-time proc-macro used by pingora-core/pingora-load-balancing (latest release, no fixed version). It produces Debug/Clone derives at build time only and has no runtime code path in jiji-proxy; replacement requires an upstream pingora change."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
reason = "unsafe-libyaml remains only through Pingora's serde_yaml dependency. Jiji parses its own configuration with yaml_serde/libyaml-rs and constructs Pingora with Server::new_with_opt_and_conf and an explicit ServerConf, so Pingora's legacy YAML loading/serialization APIs are never called. No Jiji configuration or network input reaches unsafe-libyaml."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0391"
reason = "Jiji never calls zstd APIs. The only consumers are Pingora HTTP compression and cached-header serialization: JijiProxy leaves both upstream and downstream compression disabled (Pingora's default level 0), never enables Session.cache, and never enables the default compression module or dictionary support. Thus no request, response, dictionary, buffer, or context reaches the affected zstd/zstd-safe functions. Reassess before enabling proxy compression or caching."

