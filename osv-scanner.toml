reason = "This advisory affects zstd-sys's wasm32 allocator shim. Jiji's proxy targets native hosts (Linux containers), never WebAssembly, and never calls zstd: Pingora compression and caching remain disabled. The wasm32 allocator is not compiled on Jiji's supported targets."
